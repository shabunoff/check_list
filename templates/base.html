<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Аудит респондентов{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --accent-red: #c62828;
      --accent-red-dark: #a91f1f;
      --accent-red-border: #921a1a;
      --surface: #ffffff;
      --surface-alt: #f8f9fb;
      --line: #e3e6eb;
      --text-main: #1f2937;
    }

    body {
      background: linear-gradient(180deg, #f7f8fa 0%, #eef1f4 100%);
      color: var(--text-main);
    }

    .autosave-ok { color: #198754; }
    .autosave-wait { color: #fd7e14; }

    .container { max-width: 1120px; }

    .card {
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(17, 24, 39, 0.04);
      background-color: var(--surface);
    }

    .card-header {
      background: var(--surface-alt);
      border-bottom: 1px solid var(--line);
      font-weight: 600;
    }

    .table {
      --bs-table-bg: transparent;
    }

    .table > :not(caption) > * > * {
      border-bottom-color: var(--line);
    }

    .table thead th {
      background: #f4f6f9;
      font-weight: 600;
    }

    .form-label,
    label {
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    input.form-control,
    select.form-select,
    textarea.form-control {
      border-color: #cfd5df;
    }

    input.form-control:focus,
    select.form-select:focus,
    textarea.form-control:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 0 0.2rem rgba(198, 40, 40, 0.2);
    }

    textarea.form-control { min-height: 70px; }

    .btn-accent {
      --bs-btn-color: #fff;
      --bs-btn-bg: var(--accent-red);
      --bs-btn-border-color: var(--accent-red-border);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: var(--accent-red-dark);
      --bs-btn-hover-border-color: var(--accent-red-border);
      --bs-btn-focus-shadow-rgb: 198, 40, 40;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: var(--accent-red-dark);
      --bs-btn-active-border-color: var(--accent-red-border);
      --bs-btn-disabled-color: #fff;
      --bs-btn-disabled-bg: var(--accent-red);
      --bs-btn-disabled-border-color: var(--accent-red-border);
    }

    .btn-accent-outline {
      --bs-btn-color: var(--accent-red);
      --bs-btn-border-color: var(--accent-red);
      --bs-btn-hover-color: #fff;
      --bs-btn-hover-bg: var(--accent-red);
      --bs-btn-hover-border-color: var(--accent-red-border);
      --bs-btn-focus-shadow-rgb: 198, 40, 40;
      --bs-btn-active-color: #fff;
      --bs-btn-active-bg: var(--accent-red-dark);
      --bs-btn-active-border-color: var(--accent-red-border);
      --bs-btn-disabled-color: var(--accent-red);
      --bs-btn-disabled-bg: transparent;
      --bs-btn-disabled-border-color: var(--accent-red);
    }

    .btn-neutral {
      --bs-btn-color: #374151;
      --bs-btn-bg: #fff;
      --bs-btn-border-color: #c7ced8;
      --bs-btn-hover-color: #111827;
      --bs-btn-hover-bg: #f3f4f6;
      --bs-btn-hover-border-color: #b8c0cc;
      --bs-btn-focus-shadow-rgb: 148, 163, 184;
      --bs-btn-active-color: #111827;
      --bs-btn-active-bg: #e5e7eb;
      --bs-btn-active-border-color: #b8c0cc;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/executors">Аудит</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav">
      <a class="nav-link" href="/executors">Респонденты</a>
      <a class="nav-link" href="/checklists">Чек-листы</a>
      <a class="nav-link" href="/survey">Мои опросы</a>
      <a class="nav-link" href="/reports">Отчеты</a>
      <a class="nav-link" href="/admin/">Админка</a>
    </div>
    <div class="ms-auto text-light small">
      {{ user.username }} |
      <form action="/logout/" method="post" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-light">Выход</button>
      </form>
    </div>
    {% endif %}
  </div>
</nav>
<div class="container pb-5">
  {% for message in messages %}
  <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
