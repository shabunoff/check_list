<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#C20000"/>
    </linearGradient>
    
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3243"/>
      <stop offset="100%" stop-color="#1B1E28"/>
    </linearGradient>
    
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#C20000" flood-opacity="0.4"/>
    </filter>

    <filter id="boardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g transform="translate(15, 12)">
    <rect x="10" y="15" width="66" height="82" rx="12" fill="url(#boardGrad)" filter="url(#boardShadow)"/>
    
    <rect x="11" y="16" width="64" height="80" rx="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1" />

    <path d="M 28 10 h 30 v 8 a 4 4 0 0 1 -4 4 h -22 a 4 4 0 0 1 -4 -4 v -8 z" fill="#4B5369" />
    <rect x="36" y="6" width="14" height="6" rx="3" fill="#1B1E28" />

    <line x1="26" y1="45" x2="26" y2="73" stroke="#4B5369" stroke-width="2" stroke-dasharray="3 3" opacity="0.6"/>

    <rect x="22" y="35" width="8" height="8" rx="2" fill="#4B5369" opacity="0.8"/>
    <path d="M 24 39 l 1.5 1.5 l 3 -3" fill="none" stroke="#FF2A2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="38" y="37" width="24" height="4" rx="2" fill="#4B5369" opacity="0.7"/>
    
    <rect x="22" y="55" width="8" height="8" rx="2" fill="#4B5369" opacity="0.4"/>
    <rect x="38" y="57" width="18" height="4" rx="2" fill="#4B5369" opacity="0.4"/>

    <rect x="22" y="75" width="8" height="8" rx="2" fill="#4B5369" opacity="0.4"/>
    <rect x="38" y="77" width="22" height="4" rx="2" fill="#4B5369" opacity="0.4"/>

    <path d="M 12 55 L 26 67 L 76 12" fill="none" stroke="url(#redGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#redGlow)"/>
  </g>

  <text x="130" y="78" font-family="system-ui, -apple-system, 'Montserrat', 'Segoe UI', 'Roboto', sans-serif">
    <tspan font-weight="900" font-size="56" fill="#F8FAFC">Check</tspan>
    <tspan font-weight="500" font-size="56" fill="#D1D5DB">List</tspan>
    <tspan font-weight="900" font-size="62" fill="url(#redGrad)" dy="-4">+</tspan>
  </text>
</svg>
